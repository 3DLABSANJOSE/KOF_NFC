<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOF Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Audio de Fondo -->
    <audio id="bg-music" src="intro.mp3" loop autoplay></audio>

    <!-- Botón flotante de Música -->
    <button id="music-btn" class="audio-toggle-btn" onclick="toggleMusic()">🔊 MÚSICA: ON</button>

    <div id="selector" class="menu-card">
        <h1>THE KING OF FIGHTERS</h1>
        
        <button class="game-btn" onclick="launchGame('kof96.zip')">
            <img src="kof96.png" alt="KOF 96">
            <span>KOF '96</span>
        </button>

        <button class="game-btn" onclick="launchGame('kof97.zip')">
            <img src="kof97.png" alt="KOF 97">
            <span>KOF '97</span>
        </button>

        <button class="game-btn" onclick="launchGame('kof98.zip')">
            <img src="kof98.png" alt="KOF 98">
            <span>KOF '98</span>
        </button>
    </div>

    <!-- Contenedor del Emulador -->
    <div id="emulator-container">
        <button class="back-btn" onclick="closeGame()">◀ VOLVER AL MENÚ</button>
        <div id="game" style="width:100%; height:100%;"></div>
    </div>

    <!-- Configuración Global de EmulatorJS -->
    <script>
        const music = document.getElementById('bg-music');
        music.volume = 0.4;

        function toggleMusic() {
            const btn = document.getElementById('music-btn');
            if (music.paused) {
                music.play();
                btn.textContent = "🔊 MÚSICA: ON";
            } else {
                music.pause();
                btn.textContent = "🔇 MÚSICA: OFF";
            }
        }

        // Cambiamos al núcleo mame2003_plus para mayor compatibilidad con ROMs de Neo Geo
        window.EJS_player = '#game';
        window.EJS_core = 'mame2003_plus';
        window.EJS_biosUrl = 'neogeo.zip';
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_mouse = false;
        window.EJS_multitouch = true;
        window.EJS_startOnLoaded = true;

        function launchGame(romFile) {
            music.pause();
            document.getElementById('selector').style.display = 'none';
            document.getElementById('music-btn').style.display = 'none';
            document.getElementById('emulator-container').style.display = 'block';

            window.EJS_gameUrl = romFile;

            if (document.getElementById('ejs-loader')) {
                location.reload();
                return;
            }

            let script = document.createElement('script');
            script.id = 'ejs-loader';
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }

        function closeGame() {
            location.reload();
        }
    </script>
</body>
</html>
