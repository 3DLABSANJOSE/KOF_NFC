<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOF Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Audio de Fondo (Intro KOF) -->
    <audio id="bg-music" src="intro.mp3" loop autoplay></audio>

    <!-- Botón flotante para mutear/desmutear música -->
    <button id="music-btn" class="audio-toggle-btn" onclick="toggleMusic()">🔊 MÚSICA: ON</button>

    <div id="selector" class="menu-card">
        <h1>THE KING OF FIGHTERS</h1>
        
        <!-- Botón KOF 96 -->
        <a href="https://www.neogeofun.com/kof96-2" class="game-btn" target="_blank">
            <img src="kof96.png" alt="KOF 96">
            <span>KOF '96</span>
        </a>

        <!-- Botón KOF 97 -->
        <a href="https://www.neogeofun.com/kof97" class="game-btn" target="_blank">
            <img src="kof97.png" alt="KOF 97">
            <span>KOF '97</span>
        </a>

        <!-- Botón KOF 98 -->
        <a href="https://www.retrogames.cc/arcade-games/the-king-of-fighters-98-the-slugfest-king-of-fighters-98-dream-match-never-ends-ngm-2420.html" class="game-btn" target="_blank">
            <img src="kof98.png" alt="KOF 98">
            <span>KOF '98</span>
        </a>
    </div>

    <script type="text/javascript">
        const music = document.getElementById('bg-music');
        music.volume = 0.4;

        function toggleMusic() {
            const btn = document.getElementById('music-btn');
            if (music.paused) {
                music.play();
                btn.textContent = "🔊 MÚSICA: ON";
            } else {
                music.pause();
                btn.textContent = "🔇 MÚSICA: OFF";
            }
        }
    </script>

</body>
</html>
